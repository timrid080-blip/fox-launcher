name: Fox Launcher Windows build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run launcher tests
        run: npm test
      - name: Build NSIS installer and portable EXE
        run: npm run dist
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fox-Launcher-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
