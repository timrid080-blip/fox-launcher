name: Build Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure public release metadata
        run: node -e "const fs=require('fs'),p=require('./package.json'),[owner,repo]=process.env.GITHUB_REPOSITORY.split('/');p.build.publish=[{provider:'github',owner,repo}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));const c=JSON.parse(fs.readFileSync('fox-services.json'));c.github={...c.github,owner,repo};fs.writeFileSync('fox-services.json',JSON.stringify(c,null,2))"
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: FoxLauncher-Windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            fox-services.json
            fox-news.json
            GITHUB-SETUP-RU.md
            RELEASE-1.5-RU.md
            BUILD-AND-HANDOFF-RU.md
            backend/migrate-1.5.sql
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/latest.yml dist/*.blockmap fox-services.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.exe dist/latest.yml dist/*.blockmap fox-services.json --title "Fox Launcher ${GITHUB_REF_NAME#v}" --generate-notes
          fi
