name: Fox Launcher checks

on:
  push:
    paths:
      - "main.js"
      - "preload.js"
      - "core/**"
      - "renderer/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fox-launcher-checks.yml"
  pull_request:
    paths:
      - "main.js"
      - "preload.js"
      - "core/**"
      - "renderer/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fox-launcher-checks.yml"
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run launcher tests
        run: npm test
