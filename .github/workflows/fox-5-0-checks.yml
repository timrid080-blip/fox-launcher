name: Fox Launcher 5.0 checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/fox-5-0-cinematic-android]
jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FoxLauncher-Android-5.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
